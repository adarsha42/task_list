services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/db.sqlite3
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  rq-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [ "python", "manage.py", "rqworker", "default" ]
    volumes:
      - sqlite_data:/app/data
    environment:
      - DJANGO_DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/db.sqlite3
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  rq-scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [ "rqscheduler", "--host", "redis", "--port", "6379", "--db", "0" ]
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  deadline-scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [ "python", "manage.py", "schedule_deadline_checker", "--interval", "60" ]
    volumes:
      - sqlite_data:/app/data
    environment:
      - DJANGO_DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/db.sqlite3
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      rq-scheduler:
        condition: service_started

volumes:
  redis_data:
  sqlite_data:
